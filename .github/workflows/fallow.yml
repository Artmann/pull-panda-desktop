name: Fallow

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: fallow-rs/fallow@v2
        with:
          command: audit
          comment: true
          review-comments: true
          # Pin to the version in devDependencies so CI findings match what
          # `yarn fallow` reports locally instead of floating to latest.
          version: 3.11.0
